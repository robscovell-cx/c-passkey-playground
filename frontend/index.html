<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C Passkey Playground</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      min-height: 100vh;
    }
    h1 { margin-bottom: 2rem; font-size: 1.75rem; color: #1a1a1a; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      margin-bottom: 1.5rem;
    }
    h2 { font-size: 1.1rem; color: #333; margin-bottom: 1rem; }
    input[type="text"] {
      width: 100%;
      padding: .6rem .8rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: .75rem;
      outline: none;
    }
    input[type="text"]:focus { border-color: #0071e3; }
    button {
      width: 100%;
      padding: .65rem;
      background: #0071e3;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #005bb5; }
    .status {
      margin-top: .75rem;
      font-size: .9rem;
      min-height: 1.2em;
      word-break: break-all;
    }
    .ok  { color: #1a8a1a; }
    .err { color: #c0392b; }
  </style>
</head>
<body>
  <h1>C Passkey Playground</h1>

  <div class="card">
    <h2>Register</h2>
    <input id="reg-username" type="text" placeholder="Choose a username" autocomplete="username webauthn">
    <button id="reg-btn">Register Passkey</button>
    <div id="reg-status" class="status"></div>
  </div>

  <div class="card">
    <h2>Login</h2>
    <input id="auth-username" type="text" placeholder="Username" autocomplete="username webauthn">
    <button id="auth-btn">Login with Passkey</button>
    <div id="auth-status" class="status"></div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
